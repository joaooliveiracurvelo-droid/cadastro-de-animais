<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vibe Animais</title>
<style>
*{box-sizing:border-box}body{font-family:system-ui,Arial,sans-serif;background:#f3f6f4;color:#183322;margin:0}main{max-width:820px;margin:auto;padding:16px}h1{background:#17643d;color:white;padding:20px;border-radius:14px}section{background:white;border-radius:14px;padding:20px;margin:15px 0;box-shadow:0 2px 12px #0001}label{display:block;font-weight:650;margin:10px 0 5px}input,select,textarea{background:#e3f6e7;border:1px solid #a6d5af;border-radius:9px;padding:12px;width:100%;font:inherit}textarea{min-height:90px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.name{display:grid;grid-template-columns:minmax(0,1fr) 105px;gap:12px}button{background:#17643d;color:white;border:0;border-radius:9px;padding:12px 16px;margin:8px 6px 0 0;font-weight:bold;cursor:pointer}.alt{background:#e4efe8;color:#17643d}.record{border-top:1px solid #ddd;padding:14px 0;line-height:1.6}.hidden{display:none}.notice{background:#eaf3ee;padding:12px;border-radius:9px;overflow-wrap:anywhere}@media(max-width:440px){.row{gap:8px}.name{grid-template-columns:minmax(0,1fr) 85px}}
</style></head><body><main><h1>Vibe | Cadastro de Animais</h1>
<section><div id="status" class="notice">Conectando à nuvem...</div><div id="loginBox"><label>E-mail do administrador<input id="email" type="email" autocomplete="username"></label><label>Senha<input id="password" type="password" autocomplete="current-password"></label><button id="login">Entrar como administrador</button></div><button id="logout" class="alt hidden">Sair</button></section>
<section id="editor" class="hidden"><h2>Cadastro de animais</h2><form id="form">
<div class="name"><label>Nome do animal *<input id="nome" required></label><label>Código<input id="codigo"></label></div>
<div class="row"><label>Nascimento<input id="nascimento" type="date"></label><label>Sexo<select id="sexo"><option value="">Selecione</option><option>Macho</option><option>Fêmea</option></select></label></div>
<div class="row"><label>Pai<input id="pai"></label><label>Mãe<input id="mae"></label></div>
<label>Características principais<textarea id="caracteristicas"></textarea></label><button type="submit">Salvar animal</button><button type="button" id="cancel" class="alt">Cancelar edição</button></form></section>
<section><h2>Relatório de animais cadastrados</h2><input id="search" placeholder="Pesquisar por nome ou código"><p id="total"></p><div id="list"></div></section>
</main><script>
const BASE='https://kzxcshevefhzjetlowld.supabase.co';
const KEY='sb_publishable_GPiyxGoATYbMED1Y3U73uA_An39SF2z';
const ADMIN='a015cb94-fd73-4bbd-9a90-84ff0543fdc1';
const fields=['nome','codigo','nascimento','sexo','pai','mae','caracteristicas'];
const $=id=>document.getElementById(id);
let token=null,admin=false,animals=[],editing=null;
function notice(msg){$('status').textContent=msg}
function ui(){$('editor').classList.toggle('hidden',!admin);$('loginBox').classList.toggle('hidden',admin);$('logout').classList.toggle('hidden',!admin)}
async function request(path,options={}){const headers={'apikey':KEY,'Content-Type':'application/json',...(token?{'Authorization':'Bearer '+token}:{}),...(options.headers||{})};const response=await fetch(BASE+path,{...options,headers,signal:AbortSignal.timeout(15000)});if(!response.ok){let t=await response.text();throw Error('HTTP '+response.status+': '+t.slice(0,250))}return response}
function reset(){editing=null;$('form').reset()}
function render(){const term=$('search').value.toLocaleLowerCase('pt-BR');const list=$('list');list.replaceChildren();$('total').textContent='Total: '+animals.length;const filtered=animals.filter(a=>(a.nome+' '+(a.codigo||'')).toLocaleLowerCase('pt-BR').includes(term));if(!filtered.length){list.textContent='Nenhum animal encontrado.';return}for(const a of filtered){const d=document.createElement('div');d.className='record';const title=document.createElement('strong');title.textContent=a.nome+(a.codigo?' — Código: '+a.codigo:'');d.append(title);const info=document.createElement('div');info.textContent='Nascimento: '+(a.nascimento?a.nascimento.split('-').reverse().join('/'):'—')+' | Sexo: '+(a.sexo||'—')+' | Pai: '+(a.pai||'—')+' | Mãe: '+(a.mae||'—')+' | Características: '+(a.caracteristicas||'—');d.append(info);if(admin){const edit=document.createElement('button');edit.textContent='Editar';edit.className='alt';edit.onclick=()=>{editing=a.id;fields.forEach(f=>$(f).value=a[f]||'');scrollTo({top:0,behavior:'smooth'})};d.append(edit);const del=document.createElement('button');del.textContent='Excluir';del.className='alt';del.onclick=async()=>{if(!confirm('Excluir este animal?'))return;try{await request('/rest/v1/animais?id=eq.'+encodeURIComponent(a.id),{method:'DELETE'});await load()}catch(e){notice('Erro ao excluir: '+e.message)}};d.append(del)}list.append(d)}}
async function load(){notice('Consultando animais na nuvem...');try{const r=await request('/rest/v1/animais?select=*&order=nome.asc');animals=await r.json();render();notice('Conectado à nuvem — '+(admin?'administrador':'consulta pública'))}catch(e){notice('Erro de conexão: '+e.message)}}
$('login').onclick=async()=>{try{const r=await fetch(BASE+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value.trim(),password:$('password').value}),signal:AbortSignal.timeout(15000)});const d=await r.json();if(!r.ok)throw Error(d.error_description||d.msg||'Login inválido');if(d.user?.id!==ADMIN)throw Error('Usuário sem permissão administrativa');token=d.access_token;admin=true;$('password').value='';ui();await load()}catch(e){notice('Erro no login: '+e.message)}};
$('logout').onclick=()=>{token=null;admin=false;ui();reset();load()};
$('form').onsubmit=async e=>{e.preventDefault();if(!admin)return;const data={};fields.forEach(f=>data[f]=$(f).value.trim()||null);try{await request('/rest/v1/animais'+(editing!==null?'?id=eq.'+encodeURIComponent(editing):''),{method:editing!==null?'PATCH':'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify(data)});reset();await load()}catch(e){notice('Erro ao salvar: '+e.message)}};
$('cancel').onclick=reset;$('search').oninput=render;ui();load();
</script></body></html>
